version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: radar_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: radar_glitchtip
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://radar:radar_password@radar_postgres:5432/radar_db
      - SECRET_KEY=glitchtip_secret_key_123
      - GLITCHTIP_DOMAIN=https://radar.strateg.space/sentry
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: radar_postgres
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_password
      POSTGRES_DB: radar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: radar_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5-community
    container_name: radar_neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
